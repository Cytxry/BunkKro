<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'DM Sans';
      src: url('fonts/DMSans-latin.woff2') format('woff2');
      font-weight: 400 800;
      font-style: normal;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      min-height: 420px;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
      background: #F6F5F0;
      color: #252A3D;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; }

    #loading, #error, #not-logged-in {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      text-align: center;
      padding: 20px;
    }
    #loading { color: #4555A5; font-weight: 600; font-size: 13px; }
    #error { color: #A8474B; font-weight: 600; font-size: 13px; }
    #not-logged-in { color: #252A3D; }
    #not-logged-in h3 { font-size: 16px; font-weight: 800; color: #343F83; margin-bottom: 4px; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E9E7DF;
      border-top-color: #4555A5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    h2 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #343F83;
      line-height: 1.2;
    }
    .today-sub { font-size: 12px; color: #5E6375; margin-top: 2px; font-weight: 500; }

    .summary-card {
      background: #FFFFFF;
      border: 1px solid #E7E5DF;
      border-radius: 14px;
      padding: 11px 13px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(52,63,131,.04), 0 2px 8px rgba(52,63,131,.04);
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 500;
      color: #5E6375;
      margin-bottom: 8px;
    }
    #summary-pct { color: #4555A5 !important; font-weight: 800; }
    .summary-pbar { height: 8px; background: #E9E7DF; border-radius: 999px; overflow: hidden; }
    .summary-pbar-fill { height: 100%; background: #4555A5; border-radius: 999px; transition: width 0.3s; }

    .class-item {
      position: relative;
      overflow: hidden;
      background: #FFFFFF;
      border: 1px solid #E7E5DF;
      border-radius: 14px;
      padding: 12px 12px 12px 16px;
      margin-bottom: 9px;
      box-shadow: 0 1px 2px rgba(52,63,131,.04);
    }
    .class-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #E9E7DF; }
    .class-item.marked-p::before { background: #477548; }
    .class-item.marked-a::before { background: #C65E61; }
    .class-item.marked-c::before { background: #C98A3E; }

    .class-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .class-name { font-weight: 700; font-size: 14px; color: #252A3D; }
    .class-pct { font-weight: 800; font-size: 13px; }
    .class-pct.safe { color: #477548; }
    .class-pct.warn { color: #93601F; }
    .class-pct.danger { color: #A8474B; }

    .period-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #5E6375;
      margin-bottom: 9px;
    }
    .badge-pnum {
      background: #E8EAF8;
      padding: 2px 7px;
      border-radius: 999px;
      color: #343F83;
      font-weight: 700;
    }

    .tracker-btns { display: flex; gap: 4px; background: #F0EFE8; border-radius: 11px; padding: 3px; }
    .tracker-btns button {
      flex: 1;
      padding: 7px 8px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      background: transparent;
      color: #5E6375;
    }
    .tracker-btns button:hover { background: #FFFFFF; color: #252A3D; }
    .tracker-btns button.present.active { background: #477548; color: #fff; }
    .tracker-btns button.absent.active { background: #C65E61; color: #fff; }
    .tracker-btns button.cancel.active { background: #C98A3E; color: #fff; }
    .tracker-btns button:focus-visible, .open-app:focus-visible, .login-btn:focus-visible { outline: 3px solid #6574BE; outline-offset: 2px; }

    .open-app, .login-btn {
      background: #4555A5;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(69,85,165,.22);
      transition: background 0.15s;
    }
    .open-app { width: 100%; padding: 11px; margin-top: 12px; }
    .login-btn { padding: 10px 20px; margin-top: 14px; }
    .open-app:hover, .login-btn:hover { background: #343F83; }

    .empty-state {
      text-align: center;
      padding: 28px 16px;
      color: #5E6375;
      background: #FFFFFF;
      border: 1px solid #E7E5DF;
      border-radius: 14px;
    }
    .empty-state h3 { font-size: 15px; margin-bottom: 6px; color: #252A3D; font-weight: 700; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading your schedule...</p>
  </div>
  
  <div id="error" style="display:none;">
    <p>❌ Failed to load data</p>
    <button class="login-btn" onclick="location.reload()">Retry</button>
  </div>
  
  <div id="not-logged-in" style="display:none;">
    <img src="img/cat-peek.svg" alt="" style="width:130px;margin-bottom:8px">
    <h3>Not Logged In</h3>
    <p style="color: #5E6375; font-size: 12px; margin-bottom: 4px;">Please log in to BunkKro first</p>
    <button class="login-btn" id="open-login">Open BunkKro</button>
  </div>
  
  <div id="content" style="display:none;">
    <div class="popup-header">
      <div>
        <h2>Today's Classes 📅</h2>
        <div class="today-sub" id="today-sub-text">Monday · 4 classes</div>
      </div>
    </div>

    <!-- Summary Box -->
    <div class="summary-card" id="summary-card">
      <div class="summary-row">
        <span id="summary-stats">0 of 0 marked</span>
        <span id="summary-pct">0%</span>
      </div>
      <div class="summary-pbar">
        <div class="summary-pbar-fill" id="summary-fill" style="width:0%"></div>
      </div>
    </div>

    <!-- Today's Schedule List -->
    <div id="subjects-list"></div>

    <button class="open-app" id="open-app">Open Full App 🚀</button>
  </div>

  <script src="supabase.js"></script>
  <script src="popup.js"></script>
</body>
</html>
